<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Prevozni — Bus, train and city-transit timetables in four languages">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".6" stop-color="#0d1526"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".22"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"><animate attributeName="stop-color" values="#2dd4bf;#38bdf8;#2dd4bf" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="gl" cx=".2" cy=".1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.slide{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{from{transform:translateX(-10px);opacity:.55}to{transform:none;opacity:1}}
.float{animation:fl 3.6s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.fill{animation:fi 3s ease-in-out infinite alternate}@keyframes fi{from{width:14px}to{width:var(--w)}}
.in{opacity:0;animation:up .9s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#0b1020"/><rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#gr)"/><rect width="1200" height="300" fill="url(#gl)"/>
<g class="in"><text x="76" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#8b98a9">LIVE · SERBIA &amp; MONTENEGRO</text></g>
<text class="in" style="animation-delay:.15s" x="74" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#tt)">Prevozni</text>
<text class="in" style="animation-delay:.3s" x="76" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Bus, train and city-transit timetables in four languages</text>
<g class="in" style="animation-delay:.45s"><rect x="76" y="222" width="73" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="112" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Flask</text><rect x="159" y="222" width="82" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="200" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">DuckDB</text><rect x="251" y="222" width="73" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="288" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">nginx</text><rect x="334" y="222" width="118" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="393" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Cloudflare</text></g>
<path d="M775,220 L870,168 L975,196 L1070,132 L1150,96" fill="none" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="3" stroke-dasharray="7 9"/><circle cx="775" cy="220" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="870" cy="168" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="975" cy="196" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="1070" cy="132" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="1150" cy="96" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><g class="slide" style="animation-delay:0.0s"><rect x="770" y="46" width="190" height="22" rx="8" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><circle cx="786" cy="57" r="4" fill="#2dd4bf"/></g><g class="slide" style="animation-delay:0.3s"><rect x="810" y="76" width="170" height="22" rx="8" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><circle cx="826" cy="87" r="4" fill="#2dd4bf"/></g><g class="slide" style="animation-delay:0.6s"><rect x="850" y="106" width="150" height="22" rx="8" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><circle cx="866" cy="117" r="4" fill="#2dd4bf"/></g><circle r="9" fill="#38bdf8"><animateMotion dur="7s" repeatCount="indefinite" path="M775,220 L870,168 L975,196 L1070,132 L1150,96"/></circle>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>